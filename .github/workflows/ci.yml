name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://configurador:configurador@localhost:5432/configurador?schema=public"
      DIRECT_URL: "postgresql://configurador:configurador@localhost:5432/configurador?schema=public"
      AUTH_SECRET: "ci-secret-not-for-production"
      # Stripe solo necesita una llave no vacía para construirse durante
      # `next build` (no hace llamadas reales) — nunca es una llave real.
      STRIPE_SECRET_KEY: "sk_test_ci_dummy_not_a_real_key"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    # Postgres efímero propio del job — las pruebas de aislamiento
    # multi-tenant crean y borran sus propios datos, pero nunca deben
    # correr contra la base de datos real de producción.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modula
          POSTGRES_PASSWORD: modula
          POSTGRES_DB: modula
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://modula:modula@localhost:5432/modula?schema=public"
      DIRECT_URL: "postgresql://modula:modula@localhost:5432/modula?schema=public"
      AUTH_SECRET: "ci-secret-not-for-production"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test
