name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://configurador:configurador@localhost:5432/configurador?schema=public"
      AUTH_SECRET: "ci-secret-not-for-production"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
